services:
  ralph:
    build: .
    image: ralph-local:latest
    container_name: ralph
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${HOME}/.hermes/.env
    environment:
      - RALPH_DIR=/app
      - PYTHONUNBUFFERED=1
    network_mode: host
    volumes:
      - ~/ralph/projects:/app/projects
      - ~/ralph/logs:/app/logs
    restart: "no"
    stdin_open: true
    tty: true
