# Ralph Loop Configuration
#
# This config is for running Ralph INSIDE Docker.
# It points to host.docker.internal so the container can reach
# llama-server running on the Mac Mini host.

model_url: "http://host.docker.internal:8090/v1"
model_id: "Qwen3.5-27B-Q6_K.gguf"

# Loop limits
max_iterations: 20          # Max stories to process in one ralph.sh run
max_attempts_per_story: 5   # Max retries before a story is marked failed
max_tool_calls_per_story: 160 # Max tool call rounds before giving up on a story

# Model generation limits
max_tokens: 4096            # Max tokens to generate per response

# Context budget (tokens)
# llama-server with --ctx-size 131072: each slot has n_ctx = 32768 tokens.
# 28000 keeps prompt+history well under the 32K slot limit, leaving ~4K for generation.
max_context_tokens: 28000   # Hard cap on prompt+history before API call
max_progress_lines: 100     # Reduce to keep context lean
max_tool_output_chars: 40000  # ~10K tokens per tool result — large files get truncated

# Timeouts (seconds)
request_timeout: 14400       # Local model — 2 hours; cold prefill on large context can take 20+ min
quality_check_timeout: 120  # Max time for quality check command

# Notifications
notify_on_story_complete: true
notify_on_story_fail: true
notify_on_all_complete: true
notify_on_blocked: true
